  # `problem` and `changed` are omitted: no verified outcome to state yet.
  owned: >-
    Domain discovery with engineering, commercial and operations stakeholders,
    and the design and implementation of an internal engineering calculation
    and configuration platform.
  built:
    - Python/FastAPI backend with a deterministic calculation engine and
      server-side validation, implementing engineering rules validated by domain
      specialists and derived from published lifting-equipment standards.
